# Render blueprint for the Zewa Feeds backend.
#
# FREE-TIER LAYOUT: one web service, with the BullMQ workers running inside it
# (RUN_WORKERS_IN_API). Render has no free worker or Redis tier, so the
# separate worker process this app prefers is not available here.
#
# Known limitation: a free web service sleeps after ~15 minutes idle and takes
# ~50s to wake. Inbound Razorpay webhooks can time out against a sleeping
# service, so this layout is for demos and staging — NOT for live payments.
#
# Deploy with: Render Dashboard -> New -> Blueprint -> point at this repo.
# This repo's root IS the backend (package.json sits beside this file), so no
# rootDir is set.

services:
  # ---- HTTP API ------------------------------------------------------------
  - type: web
    name: zewa-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"

      # Managed infra — wired automatically from the definitions below.
      # External free tiers: Render has no free Redis, and its free Postgres
      # expires after 30 days. Set both in the dashboard.
      #   DATABASE_URL -> Neon      (postgresql://...)
      #   REDIS_URL    -> Upstash   (rediss://...)
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

      # Generated once by Render, then shared with the worker via envVarGroup
      # so both processes verify the same tokens.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_PREVIEW_SECRET
        generateValue: true

      # Set these in the Render dashboard — never commit them.
      #   TWOFA_ENCRYPTION_KEY : 64 hex chars -> openssl rand -hex 32
      #   STOREFRONT_ORIGIN    : https://... (boot fails if it contains localhost)
      #   CMS_ORIGIN           : https://...
      #   RAZORPAY_KEY_ID / _KEY_SECRET / _WEBHOOK_SECRET
      #   ZEPTOMAIL_TOKEN      : required in production or boot fails
      #   CLOUDINARY_*
      - key: TWOFA_ENCRYPTION_KEY
        sync: false
      - key: STOREFRONT_ORIGIN
        sync: false
      - key: CMS_ORIGIN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ZEPTOMAIL_TOKEN
        sync: false
      - key: ZEPTOMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Production refuses to boot with this true — it would confirm payments
      # without charging. Stated explicitly rather than relying on the default.
      - key: RAZORPAY_AUTO_CONFIRM
        value: "false"
      - key: PAYMENT_RAZORPAY_ENABLED
        value: "true"
      - key: PAYMENT_COD_ENABLED
        value: "false"

      # No separate worker service on the free plan, so the API hosts the
      # queue consumers. Without this nothing drains the payment and email
      # queues: orders are taken but never confirmed.
      - key: RUN_WORKERS_IN_API
        value: "true"
