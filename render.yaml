# Render blueprint for the Zewa Feeds backend.
#
# ONE SERVICE. The API process serves HTTP and hosts the BullMQ consumers —
# email, payment and maintenance — via RUN_WORKERS_IN_API.
#
# This started as a free-tier workaround, because Render has no free
# background-worker tier. It is now a deliberate choice on a paid always-on
# Starter instance: a second service would double the bill to separate work that
# a single always-on process handles comfortably at this volume.
#
# WHAT THAT COSTS, STATED PLAINLY. A stuck job shares an event loop with request
# handling, so a pathological sweep can add latency to a checkout. The mitigation
# is in the workers themselves: maintenance runs at concurrency 1, is guarded by
# a Redis lock so sweeps cannot overlap, and every queue is fronted by
# guardWorker(), which pauses a worker after repeated failures instead of
# hammering a broken dependency.
#
# If order volume grows enough that this becomes visible, splitting is a
# two-line change: set RUN_WORKERS_IN_API=false here and add a service running
# `npm run worker:prod`. src/jobs/worker.ts already starts exactly the same
# three workers and registers the same schedule, so nothing else moves.
#
# ALREADY DEPLOYED. DO NOT create another Blueprint from this file.
#
# This file is synced by ONE existing Blueprint; pushing to main is all it ever
# needs. "New -> Blueprint" a second time does not update anything: Render sees
# the names already taken and creates a full second copy with a random suffix.
# That is exactly how Oct 2026 ended up with zewa-api-sg AND zewa-api-sg-ql1b,
# zewa-keyvalue-sg AND zewa-keyvalue-sg-ql1b — two of everything, billed twice,
# with the live domain on the suffixed copy. To change infrastructure, edit
# this file and push; to change a secret, use the service's Environment tab.
#
# Nothing here can create a Key Value store any more (see REDIS_URL below), so
# even an accidental re-apply only costs one web service, which fails its first
# build for want of secrets rather than quietly running.
#
# This repo's root IS the backend (package.json sits beside this file), so no
# rootDir is set.

services:
  # ---- HTTP API ------------------------------------------------------------
  - type: web
    # RENAMED FROM `zewa-api`, DELIBERATELY.
    #
    # Render fixes a service's region at creation and cannot move it, so
    # Singapore has to be a NEW service rather than a relocation of the Oregon
    # one. A different name is what makes Render create it instead of trying to
    # reconcile the existing entry.
    #
    # In the dashboard this service is `zewa-api-sg-ql1b` — the suffix is from
    # the duplicate Blueprint described at the top, and api.zewafeeds.com is
    # attached to it. Leave this name as it is: the Blueprint already links it
    # to that service, and editing it would make Render create a new one.
    # The Oregon `zewa-api` service was suspended on 17 Oct 2026.
    name: zewa-api-sg
    runtime: node
    # Supabase is in ap-south-1. Singapore is ~50ms away; Oregon was ~250ms, and
    # the catalogue query issues one round trip per relation — which is how that
    # gap surfaced as 7-20s product pages.
    region: singapore
    plan: starter
    # `--include=dev` is required, not optional. NODE_ENV=production (set below)
    # makes npm skip devDependencies, but typescript, tsc-alias, prisma and the
    # @types packages all live there — without them `tsc` fails with hundreds of
    # "Cannot find name 'process'" and "Could not find a declaration file for
    # module 'express'" errors. Runtime is unaffected: `start` runs plain JS
    # from dist/, so the dev packages are only needed during the build.
    #
    # Migrations run as part of the build, before the new code starts serving.
    buildCommand: npm ci --include=dev && npm run build && npm run prisma:deploy
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"

      # Managed infra.
      #   DATABASE_URL -> the EXISTING Supabase database in ap-south-1, via the
      #                   SESSION pooler on port 5432. Never
      #                   db.<ref>.supabase.co (IPv6-only, and the P1001 a
      #                   previous deploy hit from Render), and never port 6543
      #                   (transaction pooling breaks Prisma's interactive
      #                   transactions and `migrate deploy`'s advisory lock).
      #                   Copied verbatim from Oregon — same database, no
      #                   migration, no new instance.
      #   REDIS_URL    -> set by hand, see below.
      - key: DATABASE_URL
        sync: false
      # The SAME Supabase database, for migrations only.
      #
      # Also the session pooler (5432), which is the point: it keeps one backend
      # per client session, so `migrate deploy`'s session-scoped advisory lock is
      # taken and released on the same connection. Transaction pooling (6543)
      # hands each statement whichever backend is free, the release lands
      # elsewhere, and every later deploy dies with P1002 before the new code
      # starts serving.
      - key: DIRECT_URL
        sync: false

      # The INTERNAL connection string of a Key Value store created by hand in
      # the dashboard (Singapore, Starter, maxmemory `noeviction`, persistence
      # `journal-snapshot`) — e.g. redis://red-xxxxxxxx:6379.
      #
      # Deliberately NOT declared in this Blueprint any more. A store declared
      # here is one Render creates on every accidental re-apply, and one it
      # re-creates on the next push if it is deleted by hand — both happened.
      # Requirements for the store, and why:
      #   - Same region as this service: rate limiting reads Redis on every
      #     request, so a cross-region store adds a round trip to every call.
      #   - A paid plan: the free one has no persistence, and a restart would
      #     drop pending payment confirmations and order emails.
      #   - noeviction: a full store must fail loudly, not silently discard the
      #     oldest payment confirmation.
      #   - journal-snapshot: a redeploy must not lose delayed jobs, including
      #     the release-unpaid sweeps that free coupon and coin holds.
      # NOT optional: payments, emails, site publishing and maintenance all run
      # on its queues. /health/ready reports `redis: down` when it is missing.
      - key: REDIS_URL
        sync: false

      # ⚠️ OVERWRITE ALL THREE WITH OREGON'S VALUES ON FIRST DEPLOY.
      #
      # `generateValue` mints a fresh secret per service, which is right for a
      # brand-new environment and WRONG for this migration. These sign customer
      # and CMS sessions: if Singapore generates its own, every signed-in user is
      # logged out, and during the overlap a refresh token minted by Oregon is
      # rejected here (and vice versa).
      #
      # So let Render create them, then immediately replace all three in the
      # dashboard with the exact values the Oregon service holds. Kept as
      # `generateValue` rather than `sync: false` so a genuinely new environment
      # still boots without hand-built secrets.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_PREVIEW_SECRET
        generateValue: true

      # Set these in the Render dashboard — never commit them.
      #   TWOFA_ENCRYPTION_KEY : 64 hex chars -> openssl rand -hex 32
      #   STOREFRONT_ORIGIN    : https://... (boot fails if it contains localhost)
      #   CMS_ORIGIN           : https://...
      #   RAZORPAY_KEY_ID / _KEY_SECRET / _WEBHOOK_SECRET
      #   ZEPTOMAIL_TOKEN      : required in production or boot fails
      #   CLOUDINARY_*
      - key: TWOFA_ENCRYPTION_KEY
        sync: false
      - key: STOREFRONT_ORIGIN
        sync: false
      - key: CMS_ORIGIN
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Required at boot in production. No longer a hardcoded placeholder.
      #
      # This used to default to "placeholder-not-configured", and the mail client
      # recognises that exact string as "not configured" and SKIPS sends. Safe,
      # but silent: a new service would inherit it, boot green, pass every health
      # check, and send no mail at all — CMS login OTP included, so nobody could
      # sign in.
      #
      # (It was worse before that: a placeholder is a non-empty string, so it
      # passed the client's `!token` check and every send came back 401 SERR_157
      # "Invalid API Token found", which reads as a bad key rather than an
      # unreplaced default.)
      #
      # `sync: false` makes the omission surface at boot instead of in
      # production. Enter the real token in the dashboard, never in this file.
      - key: ZEPTOMAIL_TOKEN
        sync: false
      - key: ZEPTOMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # This service's own public origin. Signed into every upload signature as
      # Cloudinary's notification_url — without it no webhook is ever requested
      # and media state is resolved only by the hourly reconciliation sweep.
      #
      # Set this to the hostname RENDER ACTUALLY GENERATES for this service once
      # it exists — read it off the dashboard rather than assuming it follows
      # from the name. A wrong value here is silent: uploads still succeed and
      # only the notification never arrives.
      - key: PUBLIC_API_ORIGIN
        sync: false

      # Shared with the storefront's /api/revalidate route. Must match the value
      # set on Vercel exactly, or a publish leaves the shop grid stale for an
      # hour. Fail-closed on the storefront side, so a mismatch is silent.
      - key: REVALIDATE_SECRET
        sync: false
      # Website publications are confirmed by reading the storefront's pages
      # back, and REVALIDATE_SECRET is now REQUIRED for them: without it every
      # CMS website publish ends FAILED (the site keeps the previous version).
      #
      # Optional build hook (Netlify "Build hooks" / Vercel "Deploy Hooks").
      # Used for CMS → Publishing → Full rebuild, and automatically when
      # targeted regeneration fails four times. Both hosts deploy atomically,
      # so a failed build never replaces the live site.
      - key: STOREFRONT_DEPLOY_HOOK_URL
        sync: false

      # Production refuses to boot with this true — it would confirm payments
      # without charging. Stated explicitly rather than relying on the default.
      - key: RAZORPAY_AUTO_CONFIRM
        value: "false"

      # Online payment only — Cash on Delivery is switched off.
      #
      # COD is disabled here rather than deleted from the code: two existing
      # orders were placed with it, and dropping the enum value would break
      # their invoices and order history. The storefront offers Razorpay
      # exclusively; the COD branches that remain only render past orders.
      - key: PAYMENT_RAZORPAY_ENABLED
        value: "true"
      - key: PAYMENT_COD_ENABLED
        value: "false"

      # This process hosts every queue consumer: email, payment AND
      # maintenance. The last one matters — server.ts previously started only
      # email and payment, so on a single-service deployment media
      # reconciliation never ran, and surviving a missed Cloudinary webhook is
      # its entire job.
      - key: RUN_WORKERS_IN_API
        value: "true"
